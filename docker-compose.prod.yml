services:
  postgres:
    restart: unless-stopped
    ports: [] # Do not expose DB ports externally in production

  backend:
    restart: unless-stopped
    environment:
      - ENV_FILE=docker
    ports:
      - "5000:5000"
    command: npm start # Switch to your production start script

  frontend:
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: npm start # Switch to your production start script
